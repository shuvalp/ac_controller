[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gree-ac-controller"
version = "0.1.0"
description = "Ubuntu desktop and top-bar controls for Gree-compatible air conditioners"
requires-python = ">=3.10"
dependencies = ["greeclimate==3.4.1"]

[tool.setuptools.packages.find]
include = ["gree_ac*"]

[tool.setuptools.package-data]
gree_ac = ["assets/*.svg"]
